[package]
name = "farsight-views"
version = "0.1.0"
edition = "2021"
description = "View selection, transient masking and exposure normalization for phone captures (farsight splat pipeline)"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = { version = "0.3", features = ["rayon"] }
nalgebra = "0.33"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# macOS Vision/Accelerate engine: person segmentation (ANE) + vImage
# sharpness. Linux builds compile without it and fall back to the
# temporal-median masks / Rust Laplacian blur score.
vision = ["dep:objc2", "dep:objc2-foundation"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }

[profile.release]
lto = true
codegen-units = 1
