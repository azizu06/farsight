[package]
name = "farsight-views"
version = "0.1.0"
edition = "2021"
description = "View selection, transient masking and exposure normalization for phone captures (farsight splat pipeline)"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = { version = "0.3", features = ["rayon"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
