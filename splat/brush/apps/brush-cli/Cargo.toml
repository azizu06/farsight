[package]
name = "brush-cli"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

# Library used by brush-app, plus a lean headless binary for quick iteration.
[[bin]]
name = "brush-cli"
path = "src/main.rs"

[dependencies]
brush-async.path = "../../crates/brush-async"
brush-process.path = "../../crates/brush-process"

indicatif.workspace = true
indicatif-log-bridge = "0.2"
clap.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
humantime.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true

# The binary needs a multi-thread runtime; the lib alone doesn't.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
# Pins the cubecl autotune cache to CUBECL_CACHE_DIR /
# ~/.cache/farsight-splat/cubecl (main.rs init_cubecl_cache_root).
cubecl-environment.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# MSL-direct kernels on Apple silicon (bench_mac.sh enables this on
# aarch64-apple-darwin). Off everywhere else = WGSL fallback path.
metal-msl = ["brush-process/metal-msl"]

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["getrandom"]
