# Farsight: a rover iPhone tether (new enx* NIC on every replug) must never take the default route
# from campus Wi-Fi (metric 600); it stays reachable on its own subnet for camera ingest.
[connection-farsight-phone-tether]
match-device=interface-name:enx*
ipv4.route-metric=2000
ipv6.route-metric=2000
