[project]
name = "farsight-jetson"
version = "0.1.0"
description = "Farsight rover server: camera, perception, control. Runs on the Jetson; falls back to mocks elsewhere."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
  "pyserial>=3.5,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = []  # dependency-only project: run from the repo root with `python -m jetson.server`

[tool.pytest.ini_options]
testpaths = ["tests"]
