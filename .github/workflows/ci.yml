name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          python -m pip install -r tools/requirements.txt \
            -r jetson/mapping/requirements-test.txt \
            -r jetson/control/requirements.txt pytest
      - run: python -m pytest jetson/control/tests jetson/mapping/tests jetson/tests tools/tests -q

  quest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quest/package-lock.json
      - run: npm --prefix quest ci
      - run: npm --prefix quest test
      - run: npm --prefix quest run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
