<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="mapdata.js"></script>
<script>
(async()=>{
const q=new URLSearchParams(location.search),cams=await (await fetch('cams.json')).json(),c=cams[q.get('view')];
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(640,480);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x000000);
s.add(new THREE.HemisphereLight(0xffffff,0x444444,1.0));
const b64=k=>{const t=atob(MAPDATA[k]),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u.buffer};
function geo(buf,off,n){const dv=new DataView(buf),p=new Float32Array(n*3),col=new Float32Array(n*3);
 for(let i=0;i<n;i++){const o=off+i*16;for(let k=0;k<3;k++){p[i*3+k]=dv.getFloat32(o+4*k,true);col[i*3+k]=dv.getUint8(o+12+k)/255}}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));return g}
const layer=q.get('layer');
if(layer==='dots'){
 const p=b64('points'),d=b64('dense');
 s.add(new THREE.Points(geo(p,4,new DataView(p).getUint32(0,true)),new THREE.PointsMaterial({size:.04,vertexColors:true})));
 s.add(new THREE.Points(geo(d,0,d.byteLength/16),new THREE.PointsMaterial({size:.012,vertexColors:true})));
}else{
 const m=b64('surf_poisson'),dv=new DataView(m),nv=dv.getUint32(0,true);
 const g=geo(m,8,nv);g.setIndex(new THREE.BufferAttribute(new Uint32Array(m.slice(8+nv*16)),1));
 s.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide})));
}
const cam=new THREE.PerspectiveCamera(2*Math.atan(c.h/2/c.fl_y)*180/Math.PI,c.w/c.h,.02,200);
const M=new THREE.Matrix4();const a=c.m;M.set(a[0][0],a[0][1],a[0][2],a[0][3],a[1][0],a[1][1],a[1][2],a[1][3],a[2][0],a[2][1],a[2][2],a[2][3],0,0,0,1);
cam.matrixAutoUpdate=false;cam.matrix.copy(M);cam.matrixWorld.copy(M);cam.matrixWorldInverse.copy(M).invert();
r.render(s,cam);document.title='done';
})();
</script>
