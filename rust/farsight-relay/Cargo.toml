[package]
name = "farsight-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust port of the Farsight operator relay: localhost Quest app + upstream proxy over Tailscale"

[dependencies]
mimalloc = "0.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-no-provider", "stream"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
mime_guess = "2"
url = "2"

[dev-dependencies]
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
