# Farsight Nav2 parameters (ROS 2 Jazzy). Small indoor rover, ARKit odometry, LiDAR-phone point cloud.
# Tuning on the real chassis: docs/navigation.md. Velocities here are in m/s and rad/s; jetson.server maps
# them through --drive-profile when loaded, otherwise via --nav-speed-mps / --nav-turn-radps capped by
# --nav-max-v / --nav-max-w. Keep vx_max / wz_max at or under the drive profile's limits.
# No static map and no collision monitor (captain's call): the costmaps and the controller avoid obstacles.

bt_navigator:
  ros__parameters:
    global_frame: map            # identity to odom unless farsight_slam publishes map->odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.3
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # default_nav_to_pose_bt_xml is set by nav.launch.py to behavior_trees/navigate_farsight.xml
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["MPPI", "RPP"]   # the bridge publishes controller_selector from controller:=mppi|rpp
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 6.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 3.14       # go-to-point and Seek care about position, not final heading
    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40                 # 2.0 s horizon at 0.05 s
      model_dt: 0.05
      batch_size: 1000               # halved from the Nav2 default for the Orin Nano CPU; measure before raising
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.0
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.5
      vx_max: 0.50                   # AUTONOMY_MAX_PWM 150 on the 2026-10-10 drive profile: 0.55 m/s, 3.5 rad/s
      vx_min: -0.12
      vy_max: 0.0
      wz_max: 2.0                    # faster spins smear ARKit tracking; the profile allows 3.5
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.4
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.6
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
    RPP:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.50        # under the profile's 0.55 m/s at AUTONOMY_MAX_PWM 150
      lookahead_dist: 0.35            # short: pure pursuit cuts corners by about the lookahead
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: false   # no stop zone: replanning steers around new obstacles
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.08
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 3.0
      max_robot_pose_search_dist: 4.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.22
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 8.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0         # at least the depth frame rate: a popped-up obstacle lands next cycle
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.17               # the ~0.35 m wide rover body, no extra margin (captain: thread furniture)
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10                 # 0 .. 0.50 m above the floor
        max_obstacle_height: 0.50
        mark_threshold: 0
        observation_sources: depth depth_floor
        # Obstacles: points between 4 cm (floor noise, door sills the rover climbs) and the rover's top.
        depth:
          topic: /farsight/depth/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.04
          max_obstacle_height: 0.45
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
          raytrace_min_range: 0.0
          raytrace_max_range: 4.5
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
        # Floor returns clear the space the camera sees through (the obstacle source drops them by height).
        depth_floor:
          topic: /farsight/depth/points
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -0.20
          max_obstacle_height: 0.04
          raytrace_min_range: 0.0
          raytrace_max_range: 4.5
          expected_update_rate: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0         # steep: a 0.65 m gap keeps a zero-cost centre line
        inflation_radius: 0.22           # footprint + 5 cm: gaps just over the body width stay passable
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0         # IsPathValid checks this map: a person stepping in invalidates the path within 0.1 s
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: false          # remembers explored space for frontiers and replanning
      width: 40
      height: 40
      origin_x: -20.0
      origin_y: -20.0
      resolution: 0.05
      robot_radius: 0.17               # the ~0.35 m wide rover body, no extra margin (captain: thread furniture)
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: depth depth_floor
        depth:
          topic: /farsight/depth/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.04
          max_obstacle_height: 0.45
          obstacle_min_range: 0.0
          obstacle_max_range: 4.0
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0
          inf_is_valid: false
        depth_floor:
          topic: /farsight/depth/points
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -0.20
          max_obstacle_height: 0.04
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0         # steep: a 0.65 m gap keeps a zero-cost centre line
        inflation_radius: 0.22           # footprint + 5 cm: gaps just over the body width stay passable
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true            # goals and frontiers lie in unexplored space
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 0.4
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 1.5
    max_rotational_vel: 1.4
    min_rotational_vel: 0.5
    rotational_acc_lim: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 4.0
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]

# Explore selection runs at 1 Hz; the planning-gap arbiter runs at 20 Hz.
farsight_bridge:
  ros__parameters:
    explore_min_corridor_width: 0.36  # any gap the ~0.35 m rover body physically fits through
    explore_approach_length: 1.2
    explore_sensor_range: 4.0
    explore_clearance_weight: 2.5
    explore_information_weight: 3.0
    explore_size_weight: 1.5
    explore_distance_weight: 0.35
    explore_turn_weight: 0.8
    explore_clutter_weight: 3.0
    explore_revisit_weight: 3.0
    explore_revisit_decay_s: 60.0
    explore_commitment_s: 4.0
    explore_switch_margin: 0.8
    explore_transition_distance: 0.6
    explore_creep_mps: 0.25          # above both wheel floors (PWM 70/40) on the drive profile
    explore_scan_radps: 0.82
    explore_gap_budget_s: 4.0
    explore_scan_budget_s: 10.0
    explore_body_radius: 0.2          # rover half-width + 2.5 cm: body-disc and driven-floor checks
