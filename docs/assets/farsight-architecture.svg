<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-labelledby="title desc">
<title id="title">Farsight system architecture</title>
<desc id="desc">iPhone RGB, LiDAR and ARKit pose feed the Jetson Orin Nano. Onboard perception, mapping, optional Nav2 and a local Whisper, Qwen3-VL, Piper assistant connect to the Mac relay and Quest through phone bridges. USB serial drives an Arduino Uno and ELEGOO motors. After a drive, saved captures go to the Mac for parallel Brush Gaussian-splat training and CPU face pins, then browser and Quest viewers.</desc>
